# Configuración de Odoo para desarrollo local.
# La conexión a PostgreSQL la pasa la imagen oficial a partir de las variables HOST, USER y PASSWORD.
[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
log_level = info
# Sin gestor de bases de datos en la web: la base de datos la crea docker compose
list_db = False
# Contraseña maestra: en producción, define aquí admin_passwd con un valor seguro
